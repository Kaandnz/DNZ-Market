# main'e her push'ta: testler → derleme → Firebase'e site yayını. (Güvenlik kuralları elle: npm run deploy:rules)
# Testlerden biri bile kırılırsa yayın yapılmaz, canlı site eski haliyle kalır.
#
# Gerekli GitHub secret'ı: FIREBASE_SERVICE_ACCOUNT_DNZ_BAKKAL (Firebase servis hesabı JSON anahtarı)
# Kurulumu README.md → "Otomatik yayın" bölümünde. Secret yoksa testler yine çalışır, yayın atlanır.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilir

# Aynı anda iki yayın çakışmasın; yeni push gelirse sıradaki beklesin.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNZ_BAKKAL }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # kural dosyası değişti mi diye karşılaştırmak için

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc -b

      - name: Birim testleri
        run: npm test

      # Güvenlik kuralı testleri Firestore Emulator içinde çalışır (Java 21 gerekir).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Güvenlik kuralı testleri
        run: npm run test:rules

      - name: Derleme
        run: npm run build

      - name: Servis hesabı yok, yayın atlanıyor
        if: env.FIREBASE_SA == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_DNZ_BAKKAL secret'ı tanımlı değil; testler geçti ama yayın yapılmadı. README → Otomatik yayın."

      - uses: google-github-actions/auth@v3
        if: env.FIREBASE_SA != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNZ_BAKKAL }}

      # Servis hesabı (firebase init hosting:github ile açıldı) sadece siteyi yayınlayabilir.
      # Güvenlik kuralları / indeksler elle yayınlanır: npm run deploy:rules
      - name: Kurallar değiştiyse hatırlat
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^firestore\.(rules|indexes\.json)$'; then
            echo "::warning::firestore.rules / firestore.indexes.json değişti. Otomatik yayınlanmaz, elle yayınla: npm run deploy:rules"
          fi

      - name: Siteyi yayınla
        if: env.FIREBASE_SA != ''
        run: npx firebase deploy --only hosting --project dnz-bakkal --non-interactive --force
